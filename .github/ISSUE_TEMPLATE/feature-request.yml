name: Feature request
description: Suggest a focused improvement to Tiny Rogues Training Dummy
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the player workflow or limitation, not just the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workaround
      description: Include any current workaround, such as manual aiming or another measurement method.

  - type: textarea
    id: validation
    attributes:
      label: How could this be validated?
      description: Describe a short in-game test that would show the change works.
